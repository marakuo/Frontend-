<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook</title>
    <link rel="stylesheet" href="./CSS/style.css">
</head>
<body>
    <!-- start header home section -->

    <header class="header-home">
        <!-- start left side -->
        <div class="left-side">
           <img src="./images/logo.svg" alt="logo">
            <p>Facebook help you connect and share<br>with the life people in your life</p>
            
        </div>
        <!-- end left side -->

        <!-- start right side -->
        <div class="right-side">
            <form action="">
                <input type="text" name="email" placeholder="Email address or phone number"><br>
                <input type="password" name="pass" placeholder="Password"><br>
                <input type="submit" value="Log in"><br>
                <a href="#">Forgotten password</a> <hr>
                <a href="#">Create new account</a>
            </form>
            
        </div>
        <!-- end right side -->
    </header>

    <!-- end header home section -->

    
</body>
</html>
